services:
  db:
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 3
      start_period: 5s

  server:
    build: Server
    ports:
      - 8000:8000
    env_file:
      - Server/.env
    environment:
      - USE_HTTPS=1
      - is_using_container=1
    volumes:
      # always prefix host machine's bind-mount paths with ./! else volume is considered a named volume
      # path at the container's side (after :) must also be absolute. docker can misinterpret relative ones.
      - ./Server:/server:z
      - ./localhost+3-key.pem:/certs/key.pem:ro,z
      - ./localhost+3.pem:/certs/cert.pem:ro,z
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import urllib.request, ssl; urllib.request.urlopen("https://localhost:8000/ping", context=ssl._create_unverified_context())''',
        ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy

  client:
    build: Client
    ports:
      - 5173:5173
    env_file:
      - Client/.env
    environment:
      - VITE_IS_USING_CONTAINER=1
      - VITE_USE_HTTPS=1
    volumes:
      - ./Client:/app:z
      - /app/node_modules
      - ./localhost+3-key.pem:/certs/key.pem:ro,z
      - ./localhost+3.pem:/certs/cert.pem:ro,z
    command: ["npm", "run", "dev:with-types:docker"]
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
