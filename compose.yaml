services:
  db:
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 3

  server:
    build: ./Server
    ports:
      - "8000:8000"
    env_file:
      - ./Server/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./Server:/server:z
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import urllib.request; urllib.request.urlopen("http://localhost:8000/ping")''',
        ]
      interval: 5s
      timeout: 3s
      retries: 3
    command: >
      sh -c "alembic upgrade head && python -m app.scripts.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  client:
    build: ./Client
    volumes:
      - ./Client:/app:z
      - /app/node_modules
    env_file:
      - ./Client/.env
    depends_on:
      server:
        condition: service_healthy
    command: ["npm", "run", "dev:with-types:docker"]

volumes:
  postgres_data:
